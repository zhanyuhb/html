<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>国际象棋 · 双人对战 & 人机对战 | 难度可选</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #2a3b3c 0%, #1a2a2b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: #b5884b;
            background-image: radial-gradient(circle at 25% 40%, rgba(200, 160, 100, 0.3) 2%, transparent 2.5%);
            background-size: 48px 48px;
            border-radius: 48px 48px 40px 40px;
            box-shadow: 0 25px 35px rgba(0,0,0,0.5), inset 0 1px 3px rgba(255,245,200,0.6);
            padding: 24px 28px 32px 28px;
        }

        .board-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #deb887;
            border-radius: 24px;
            box-shadow: inset 0 0 0 1px #f5e5c8, inset 0 0 0 6px #b97f44, 0 15px 25px rgba(0,0,0,0.4);
            padding: 12px;
        }

        canvas {
            display: block;
            margin: 0 auto;
            background: #f0d9b5;
            border-radius: 12px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
            cursor: pointer;
            width: 100%;
            height: auto;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .turn-indicator {
            background: #2b2b28;
            padding: 8px 24px;
            border-radius: 60px;
            box-shadow: inset 0 1px 0 #5f5b54, 0 6px 12px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .piece-sample {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            background: #2c2b28;
            box-shadow: inset 0 0 0 1px #777;
        }

        .turn-text {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #f7e9c3;
            text-shadow: 0 2px 0 #1e2a24;
        }

        .status-message {
            background: #1f2c27e6;
            backdrop-filter: blur(4px);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffecb3;
            min-width: 180px;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        button {
            background: #e0bc7c;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 8px 24px;
            border-radius: 40px;
            color: #2c241a;
            cursor: pointer;
            transition: 0.1s linear;
            font-family: inherit;
            box-shadow: 0 5px 0 #7a5836;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #7a5836;
        }

        .mode-group {
            display: flex;
            gap: 12px;
            background: #2b2a26aa;
            backdrop-filter: blur(4px);
            padding: 5px 12px;
            border-radius: 48px;
            align-items: center;
        }

        .mode-btn {
            background: #c7a15e;
            box-shadow: 0 3px 0 #6f4f2e;
            transform: translateY(-1px);
            padding: 5px 20px;
            font-size: 0.9rem;
        }

        .mode-btn.active {
            background: #f3d48f;
            color: #2d2b1f;
            box-shadow: 0 1px 0 #6f4f2e;
            transform: translateY(2px);
        }

        .difficulty-select {
            background: #f7e9c3;
            border: none;
            border-radius: 32px;
            padding: 6px 12px;
            font-weight: bold;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            margin-left: 8px;
            outline: none;
        }

        .check-warning {
            animation: checkPulse 0.6s ease;
        }

        @keyframes checkPulse {
            0% { background-color: #8b2c2c; color: #fff0b5; }
            100% { background-color: #1f2c27e6; }
        }

        @media (max-width: 620px) {
            .game-container { padding: 16px 18px 24px 18px; }
            .turn-text { font-size: 1.1rem; }
            .piece-sample { width: 30px; height: 30px; font-size: 1.4rem; }
            .status-message { font-size: 0.8rem; min-width: 130px; }
            button { padding: 5px 16px; font-size: 0.85rem; }
            .mode-btn { padding: 3px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="board-wrapper">
            <canvas id="chessCanvas" width="560" height="560" style="width:100%; height:auto; max-width:560px; aspect-ratio:1/1">
                您的浏览器不支持Canvas
            </canvas>
        </div>
        <div class="info-panel">
            <div class="turn-indicator">
                <div class="piece-sample" id="pieceSample">♔</div>
                <div class="turn-text" id="turnText">白方走棋</div>
            </div>
            <div class="status-message" id="statusMsg">♔ 白方先走 · 对局开始</div>
            <button id="resetButton">🔄 新的一局</button>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 12px; flex-wrap: wrap;">
            <div class="mode-group">
                <button id="pvpModeBtn" class="mode-btn active">👥 双人对战</button>
                <button id="pveModeBtn" class="mode-btn">🤖 人机对战</button>
                <select id="difficultySelect" class="difficulty-select" disabled>
                    <option value="easy">🍃 简单</option>
                    <option value="medium" selected>⚖️ 中等</option>
                    <option value="hard">🔥 困难</option>
                </select>
            </div>
            <div style="font-size: 0.7rem; color:#f7efcf; background:#2b2a26aa; padding: 4px 12px; border-radius: 40px;">
                📌 点击棋子→再点击格子 | 人机模式玩家执白
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- 棋盘表示 ----------
        let boardState = Array(8).fill().map(() => Array(8).fill(null));
        
        // 初始盘面 (FEN 初始布局)
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
            ['',  '',  '',  '',  '',  '',  '',  ''],
            ['',  '',  '',  '',  '',  '',  '',  ''],
            ['',  '',  '',  '',  '',  '',  '',  ''],
            ['',  '',  '',  '',  '',  '',  '',  ''],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
        ];
        
        // 游戏状态
        let currentTurn = 'white';   // white先走
        let gameOver = false;
        let winner = null;
        let selectedRow = null, selectedCol = null;
        let checkForSide = null;
        
        // 易位标志
        let whiteKingMoved = false, blackKingMoved = false;
        let whiteRookMoved = { kingSide: false, queenSide: false };
        let blackRookMoved = { kingSide: false, queenSide: false };
        
        // 模式与AI
        let gameMode = 'pvp';           // 'pvp' 或 'pve'
        let aiDifficulty = 'medium';
        const playerColor = 'white';    // 人机模式玩家执白先手，AI执黑
        const aiColor = 'black';
        let isAIPlaying = false;
        let aiScheduled = false;
        
        // DOM 元素
        const canvas = document.getElementById('chessCanvas');
        const ctx = canvas.getContext('2d');
        const turnTextSpan = document.getElementById('turnText');
        const statusMsgDiv = document.getElementById('statusMsg');
        const pieceSampleSpan = document.getElementById('pieceSample');
        const resetBtn = document.getElementById('resetButton');
        const pvpModeBtn = document.getElementById('pvpModeBtn');
        const pveModeBtn = document.getElementById('pveModeBtn');
        const difficultySelect = document.getElementById('difficultySelect');
        
        let cellSize = 0;
        
        // ---------- 辅助函数 ----------
        function getPieceColor(piece){
            if(!piece) return null;
            return (piece === piece.toUpperCase() && piece !== piece.toLowerCase()) ? 'white' : 'black';
        }
        
        function getPieceSymbol(piece){
            if(!piece) return "";
            const map = {
                'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟',
                'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙'
            };
            return map[piece] || "";
        }
        
        // 兵升变 (自动升后)
        function promotePawn(row, col){
            const piece = boardState[row][col];
            if(!piece) return;
            if(piece.toLowerCase() === 'p'){
                const color = getPieceColor(piece);
                if((color === 'white' && row === 0) || (color === 'black' && row === 7)){
                    boardState[row][col] = (color === 'white') ? 'Q' : 'q';
                }
            }
        }
        
        // 复制棋盘
        function copyBoard(board){
            return board.map(row => [...row]);
        }
        
        // 获取国王位置
        function getKingPosition(board, color){
            const target = (color === 'white') ? 'K' : 'k';
            for(let i=0;i<8;i++){
                for(let j=0;j<8;j++){
                    if(board[i][j] === target) return {row:i, col:j};
                }
            }
            return null;
        }
        
        // 检查某个格子是否被攻击
        function isSquareAttacked(board, row, col, defendingColor){
            for(let i=0;i<8;i++){
                for(let j=0;j<8;j++){
                    const piece = board[i][j];
                    if(piece){
                        const pieceColor = getPieceColor(piece);
                        if(pieceColor !== defendingColor){
                            if(isValidMoveWithoutSelfCheck(piece, i, j, row, col, board)){
                                return true;
                            }
                        }
                    }
                }
            }
            return false;
        }
        
        // 基础移动合法性 (不考虑王被将军)
        function isValidMoveWithoutSelfCheck(piece, fromRow, fromCol, toRow, toCol, board) {
            const color = getPieceColor(piece);
            const targetPiece = board[toRow][toCol];
            if(targetPiece && getPieceColor(targetPiece) === color) return false;
            
            const rowDiff = toRow - fromRow;
            const colDiff = toCol - fromCol;
            const absRow = Math.abs(rowDiff);
            const absCol = Math.abs(colDiff);
            
            switch(piece.toLowerCase()){
                case 'p':
                    const dir = (color === 'white') ? -1 : 1;
                    const startRow = (color === 'white') ? 6 : 1;
                    if(colDiff === 0 && rowDiff === dir && !targetPiece) return true;
                    if(colDiff === 0 && rowDiff === 2*dir && fromRow === startRow && !targetPiece && !board[fromRow+dir][fromCol]) return true;
                    if(absRow === 1 && absCol === 1 && targetPiece && getPieceColor(targetPiece) !== color) return true;
                    return false;
                case 'n':
                    if((absRow === 2 && absCol === 1) || (absRow === 1 && absCol === 2)) return true;
                    return false;
                case 'r':
                    if(fromRow !== toRow && fromCol !== toCol) return false;
                    if(fromRow === toRow){
                        let step = (toCol > fromCol) ? 1 : -1;
                        for(let c=fromCol+step; c!==toCol; c+=step) if(board[toRow][c]) return false;
                    } else {
                        let step = (toRow > fromRow) ? 1 : -1;
                        for(let r=fromRow+step; r!==toRow; r+=step) if(board[r][toCol]) return false;
                    }
                    return true;
                case 'b':
                    if(absRow !== absCol) return false;
                    let rowStep = (toRow > fromRow) ? 1 : -1;
                    let colStep = (toCol > fromCol) ? 1 : -1;
                    let r = fromRow+rowStep, c = fromCol+colStep;
                    while(r !== toRow && c !== toCol){
                        if(board[r][c]) return false;
                        r += rowStep; c += colStep;
                    }
                    return true;
                case 'q':
                    const isRookMove = (fromRow === toRow || fromCol === toCol);
                    const isBishopMove = (absRow === absCol);
                    if(!isRookMove && !isBishopMove) return false;
                    if(isRookMove){
                        if(fromRow === toRow){
                            let step = (toCol > fromCol) ? 1 : -1;
                            for(let c=fromCol+step; c!==toCol; c+=step) if(board[toRow][c]) return false;
                        } else {
                            let step = (toRow > fromRow) ? 1 : -1;
                            for(let r=fromRow+step; r!==toRow; r+=step) if(board[r][toCol]) return false;
                        }
                    } else {
                        let rowStep = (toRow > fromRow) ? 1 : -1;
                        let colStep = (toCol > fromCol) ? 1 : -1;
                        let rr = fromRow+rowStep, cc = fromCol+colStep;
                        while(rr !== toRow && cc !== toCol){
                            if(board[rr][cc]) return false;
                            rr += rowStep; cc += colStep;
                        }
                    }
                    return true;
                case 'k':
                    if(absRow <= 1 && absCol <= 1) return true;
                    if(absRow === 0 && absCol === 2){
                        const isKingSide = (toCol === 6);
                        const isQueenSide = (toCol === 2);
                        if(!isKingSide && !isQueenSide) return false;
                        const rookCol = isKingSide ? 7 : 0;
                        const rook = board[toRow][rookCol];
                        if(!rook || rook.toLowerCase() !== 'r') return false;
                        if(getPieceColor(rook) !== color) return false;
                        if(color === 'white'){
                            if(whiteKingMoved) return false;
                            if(isKingSide && whiteRookMoved.kingSide) return false;
                            if(isQueenSide && whiteRookMoved.queenSide) return false;
                        } else {
                            if(blackKingMoved) return false;
                            if(isKingSide && blackRookMoved.kingSide) return false;
                            if(isQueenSide && blackRookMoved.queenSide) return false;
                        }
                        const step = isKingSide ? 1 : -1;
                        for(let c=fromCol+step; c!==rookCol; c+=step) if(board[toRow][c]) return false;
                        return true;
                    }
                    return false;
                default: return false;
            }
        }
        
        // 完整合法性 (移动后己方王不被将)
        function isMoveLegal(piece, fromRow, fromCol, toRow, toCol, board, color) {
            if(!piece || getPieceColor(piece) !== color) return false;
            if(!isValidMoveWithoutSelfCheck(piece, fromRow, fromCol, toRow, toCol, board)) return false;
            const newBoard = copyBoard(board);
            newBoard[toRow][toCol] = newBoard[fromRow][fromCol];
            newBoard[fromRow][fromCol] = null;
            const movedPiece = newBoard[toRow][toCol];
            if(movedPiece && movedPiece.toLowerCase() === 'p'){
                const pc = getPieceColor(movedPiece);
                if((pc === 'white' && toRow === 0) || (pc === 'black' && toRow === 7)){
                    newBoard[toRow][toCol] = (pc === 'white') ? 'Q' : 'q';
                }
            }
            const kingPos = getKingPosition(newBoard, color);
            if(!kingPos) return false;
            if(isSquareAttacked(newBoard, kingPos.row, kingPos.col, color)) return false;
            if(piece.toLowerCase() === 'k' && Math.abs(toCol - fromCol) === 2){
                const step = (toCol > fromCol) ? 1 : -1;
                for(let c = fromCol; c !== toCol; c+=step){
                    if(isSquareAttacked(board, fromRow, c, color)) return false;
                }
            }
            return true;
        }
        
        // 检查一方是否有合法步
        function hasAnyLegalMove(color, board){
            for(let i=0;i<8;i++){
                for(let j=0;j<8;j++){
                    const piece = board[i][j];
                    if(piece && getPieceColor(piece) === color){
                        for(let ti=0;ti<8;ti++){
                            for(let tj=0;tj<8;tj++){
                                if(isMoveLegal(piece, i, j, ti, tj, board, color)){
                                    return true;
                                }
                            }
                        }
                    }
                }
            }
            return false;
        }
        
        // 更新游戏结束状态
        function updateGameOver() {
            const kingPos = getKingPosition(boardState, currentTurn);
            const inCheck = kingPos ? isSquareAttacked(boardState, kingPos.row, kingPos.col, currentTurn) : false;
            const hasMoves = hasAnyLegalMove(currentTurn, boardState);
            if(!hasMoves){
                gameOver = true;
                if(inCheck){
                    winner = (currentTurn === 'white') ? 'black' : 'white';
                    statusMsgDiv.innerHTML = winner === 'white' ? "🏆 白方将死黑方获胜！🏆" : "🏆 黑方将死白方获胜！🏆";
                    turnTextSpan.innerText = winner === 'white' ? "白胜" : "黑胜";
                } else {
                    winner = null;
                    statusMsgDiv.innerHTML = "🤝 逼和！ 棋局结束 🤝";
                    turnTextSpan.innerText = "和棋";
                }
                statusMsgDiv.classList.add('check-warning');
                renderFullCanvas();
                return true;
            }
            if(inCheck){
                statusMsgDiv.innerHTML = (currentTurn === 'white' ? "⚪ 白方被将军！" : "⚫ 黑方被将军！");
                statusMsgDiv.classList.add('check-warning');
                setTimeout(()=> statusMsgDiv.classList.remove('check-warning'), 700);
            } else {
                statusMsgDiv.innerHTML = (currentTurn === 'white' ? "⚪ 白方回合" : "⚫ 黑方回合");
            }
            return false;
        }
        
        // 执行移动
        function applyMove(fromRow, fromCol, toRow, toCol, skipTurnSwitch = false) {
            const piece = boardState[fromRow][fromCol];
            if(!piece) return false;
            const color = getPieceColor(piece);
            if(color !== currentTurn) return false;
            if(!isMoveLegal(piece, fromRow, fromCol, toRow, toCol, boardState, currentTurn)) return false;
            
            boardState[toRow][toCol] = piece;
            boardState[fromRow][fromCol] = null;
            
            // 处理易位及车移动标记
            const pieceLow = piece.toLowerCase();
            if(pieceLow === 'k'){
                if(color === 'white') whiteKingMoved = true;
                else blackKingMoved = true;
                if(Math.abs(toCol - fromCol) === 2){
                    const isKingSide = (toCol === 6);
                    const rookFromCol = isKingSide ? 7 : 0;
                    const rookToCol = isKingSide ? 5 : 3;
                    const rook = boardState[toRow][rookFromCol];
                    if(rook && rook.toLowerCase() === 'r'){
                        boardState[toRow][rookToCol] = rook;
                        boardState[toRow][rookFromCol] = null;
                        if(color === 'white'){
                            if(isKingSide) whiteRookMoved.kingSide = true;
                            else whiteRookMoved.queenSide = true;
                        } else {
                            if(isKingSide) blackRookMoved.kingSide = true;
                            else blackRookMoved.queenSide = true;
                        }
                    }
                }
            }
            if(pieceLow === 'r'){
                if(color === 'white'){
                    if(fromRow === 7 && fromCol === 0) whiteRookMoved.queenSide = true;
                    if(fromRow === 7 && fromCol === 7) whiteRookMoved.kingSide = true;
                } else {
                    if(fromRow === 0 && fromCol === 0) blackRookMoved.queenSide = true;
                    if(fromRow === 0 && fromCol === 7) blackRookMoved.kingSide = true;
                }
            }
            
            promotePawn(toRow, toCol);
            if(!skipTurnSwitch) currentTurn = (currentTurn === 'white') ? 'black' : 'white';
            updateUITurn();
            renderFullCanvas();
            updateGameOver();
            return true;
        }
        
        // ---------- AI 决策 (简单权重评分) ----------
        function evaluateBoardForColor(board, color) {
            const pieceValues = { 'p':10, 'n':30, 'b':30, 'r':50, 'q':90, 'k':900 };
            let score = 0;
            for(let i=0;i<8;i++){
                for(let j=0;j<8;j++){
                    const p = board[i][j];
                    if(p){
                        const val = pieceValues[p.toLowerCase()] || 0;
                        if(getPieceColor(p) === color) score += val;
                        else score -= val;
                    }
                }
            }
            return score;
        }
        
        // 生成所有合法走法
        function getAllMovesForColor(board, color){
            const moves = [];
            for(let i=0;i<8;i++){
                for(let j=0;j<8;j++){
                    const piece = board[i][j];
                    if(piece && getPieceColor(piece) === color){
                        for(let ti=0;ti<8;ti++){
                            for(let tj=0;tj<8;tj++){
                                if(isMoveLegal(piece, i, j, ti, tj, board, color)){
                                    moves.push({from:{row:i,col:j}, to:{row:ti,col:tj}});
                                }
                            }
                        }
                    }
                }
            }
            return moves;
        }
        
        // AI走法 (简单: 简单随机 / 中等加权随机 / 困难最佳)
        function getAIMove() {
            const moves = getAllMovesForColor(boardState, aiColor);
            if(moves.length === 0) return null;
            if(aiDifficulty === 'easy'){
                const rand = Math.floor(Math.random() * moves.length);
                return moves[rand];
            }
            // 中等和困难：基于局面评分选取
            const scored = moves.map(move => {
                const testBoard = copyBoard(boardState);
                const piece = testBoard[move.from.row][move.from.col];
                testBoard[move.to.row][move.to.col] = piece;
                testBoard[move.from.row][move.from.col] = null;
                if(piece.toLowerCase() === 'p' && ((getPieceColor(piece)==='white' && move.to.row===0) || (getPieceColor(piece)==='black' && move.to.row===7))){
                    testBoard[move.to.row][move.to.col] = (getPieceColor(piece)==='white')?'Q':'q';
                }
                const score = evaluateBoardForColor(testBoard, aiColor);
                return { move, score };
            });
            scored.sort((a,b)=>b.score - a.score);
            if(aiDifficulty === 'hard'){
                return scored[0].move;
            } else { // medium 从前30%或至少前3中随机
                const topCount = Math.max(1, Math.min(5, Math.ceil(scored.length * 0.3)));
                const idx = Math.floor(Math.random() * topCount);
                return scored[idx].move;
            }
        }
        
        async function executeAIMove() {
            if(gameOver) return;
            if(gameMode !== 'pve') return;
            if(currentTurn !== aiColor) return;
            if(isAIPlaying) return;
            isAIPlaying = true;
            const move = getAIMove();
            if(move){
                applyMove(move.from.row, move.from.col, move.to.row, move.to.col, false);
            }
            isAIPlaying = false;
            if(!gameOver && gameMode === 'pve' && currentTurn === aiColor){
                setTimeout(()=> executeAIMove(), 200);
            }
        }
        
        function scheduleAIMoveIfNeeded() {
            if(gameOver) return;
            if(gameMode === 'pve' && currentTurn === aiColor && !isAIPlaying && !gameOver){
                setTimeout(()=> executeAIMove(), 100);
            }
        }
        
        // UI更新
        function updateUITurn() {
            if(gameOver) return;
            if(gameMode === 'pvp'){
                turnTextSpan.innerText = (currentTurn === 'white') ? "白方走棋" : "黑方走棋";
                pieceSampleSpan.innerHTML = (currentTurn === 'white') ? "♔" : "♚";
                pieceSampleSpan.style.background = (currentTurn === 'white') ? "#f5f0e0" : "#2c2b28";
                pieceSampleSpan.style.color = (currentTurn === 'white') ? "#2c2c2c" : "#eedd99";
            } else {
                if(currentTurn === playerColor){
                    turnTextSpan.innerText = "👤 玩家回合";
                    pieceSampleSpan.innerHTML = "♔";
                    pieceSampleSpan.style.background = "#f5f0e0";
                } else {
                    turnTextSpan.innerText = "🤖 AI 思考中";
                    pieceSampleSpan.innerHTML = "♚";
                    pieceSampleSpan.style.background = "#2c2b28";
                }
                pieceSampleSpan.style.color = (currentTurn === playerColor) ? "#2c2c2c" : "#eedd99";
            }
        }
        
        // 重置游戏
        function resetGame() {
            for(let i=0;i<8;i++){
                for(let j=0;j<8;j++){
                    boardState[i][j] = initialBoard[i][j] === '' ? null : initialBoard[i][j];
                }
            }
            currentTurn = 'white';
            gameOver = false;
            winner = null;
            selectedRow = null;
            selectedCol = null;
            whiteKingMoved = false;
            blackKingMoved = false;
            whiteRookMoved = { kingSide: false, queenSide: false };
            blackRookMoved = { kingSide: false, queenSide: false };
            checkForSide = null;
            isAIPlaying = false;
            aiScheduled = false;
            updateUITurn();
            statusMsgDiv.innerHTML = (gameMode === 'pvp') ? "♔ 白方先走 · 双人对战" : "🤖 人机模式 · 玩家执白先走";
            statusMsgDiv.classList.remove('check-warning');
            renderFullCanvas();
            if(gameMode === 'pve' && currentTurn === aiColor){
                setTimeout(()=> executeAIMove(), 200);
            }
        }
        
        // 模式切换
        function setMode(mode){
            gameMode = mode;
            if(mode === 'pvp'){
                difficultySelect.disabled = true;
                pvpModeBtn.classList.add('active');
                pveModeBtn.classList.remove('active');
            } else {
                difficultySelect.disabled = false;
                aiDifficulty = difficultySelect.value;
                pvpModeBtn.classList.remove('active');
                pveModeBtn.classList.add('active');
            }
            resetGame();
        }
        
        // 绘制棋盘
        function renderFullCanvas() {
            const size = canvas.width;
            cellSize = size / 8;
            ctx.clearRect(0,0,size,size);
            for(let i=0;i<8;i++){
                for(let j=0;j<8;j++){
                    const isLight = (i+j)%2 === 0;
                    ctx.fillStyle = isLight ? '#f0d9b5' : '#b58863';
                    ctx.fillRect(j*cellSize, i*cellSize, cellSize, cellSize);
                }
            }
            if(selectedRow !== null && selectedCol !== null){
                ctx.fillStyle = 'rgba(80, 180, 80, 0.5)';
                ctx.fillRect(selectedCol*cellSize, selectedRow*cellSize, cellSize, cellSize);
                const piece = boardState[selectedRow][selectedCol];
                if(piece && !gameOver && getPieceColor(piece) === currentTurn){
                    for(let i=0;i<8;i++){
                        for(let j=0;j<8;j++){
                            if(isMoveLegal(piece, selectedRow, selectedCol, i, j, boardState, currentTurn)){
                                ctx.fillStyle = 'rgba(0, 200, 0, 0.35)';
                                ctx.fillRect(j*cellSize, i*cellSize, cellSize, cellSize);
                            }
                        }
                    }
                }
            }
            for(let i=0;i<8;i++){
                for(let j=0;j<8;j++){
                    const piece = boardState[i][j];
                    if(piece){
                        const symbol = getPieceSymbol(piece);
                        ctx.font = `bold ${Math.floor(cellSize * 0.68)}px 'Segoe UI', 'Noto Sans'`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        const isWhitePiece = getPieceColor(piece) === 'white';
                        ctx.fillStyle = isWhitePiece ? '#ffffff' : '#222222';
                        ctx.fillText(symbol, j*cellSize + cellSize/2, i*cellSize + cellSize/2);
                        ctx.fillStyle = isWhitePiece ? '#fafaf5' : '#333333';
                        ctx.fillText(symbol, j*cellSize + cellSize/2-1, i*cellSize + cellSize/2-1);
                    }
                }
            }
            if(gameOver){
                ctx.font = `bold ${Math.floor(cellSize*0.5)}px "Segoe UI"`;
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                const msg = winner ? (winner==='white'?"白方胜利":"黑方胜利") : "和棋";
                ctx.fillText(msg, canvas.width/2+2, canvas.height/2);
                ctx.fillStyle = "#f7e05e";
                ctx.fillText(msg, canvas.width/2, canvas.height/2-2);
            }
        }
        
        // 交互
        function handleCanvasTap(e){
            if(gameOver){
                statusMsgDiv.innerHTML = "游戏已结束，点击新对局";
                return;
            }
            if(gameMode === 'pve' && currentTurn !== playerColor){
                statusMsgDiv.innerHTML = "🤖 AI思考中，请等待...";
                return;
            }
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            let clientX, clientY;
            if(e.touches){
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const canvasX = (clientX - rect.left) * scale;
            const canvasY = (clientY - rect.top) * scale;
            const col = Math.floor(canvasX / cellSize);
            const row = Math.floor(canvasY / cellSize);
            if(row<0 || row>=8 || col<0 || col>=8) return;
            if(selectedRow === null){
                const piece = boardState[row][col];
                if(piece && getPieceColor(piece) === currentTurn){
                    selectedRow = row;
                    selectedCol = col;
                    renderFullCanvas();
                } else {
                    statusMsgDiv.innerHTML = "请先选中己方棋子";
                    setTimeout(()=>{if(!gameOver) updateUITurn();},700);
                }
            } else {
                const success = applyMove(selectedRow, selectedCol, row, col);
                selectedRow = null;
                selectedCol = null;
                if(!success){
                    statusMsgDiv.innerHTML = "不合规则，不能这样移动";
                    setTimeout(()=>{if(!gameOver) updateUITurn();},700);
                } else {
                    if(gameMode === 'pve' && !gameOver && currentTurn === aiColor){
                        scheduleAIMoveIfNeeded();
                    }
                }
                renderFullCanvas();
            }
        }
        
        function bindEvents(){
            canvas.addEventListener('mousedown', handleCanvasTap);
            canvas.addEventListener('touchstart', handleCanvasTap, {passive: false});
            canvas.addEventListener('touchmove', (e)=>e.preventDefault(),{passive:false});
            resetBtn.addEventListener('click', ()=>{
                selectedRow = null;
                resetGame();
            });
            pvpModeBtn.addEventListener('click', ()=> setMode('pvp'));
            pveModeBtn.addEventListener('click', ()=> setMode('pve'));
            difficultySelect.addEventListener('change', (e)=>{
                aiDifficulty = e.target.value;
                if(gameMode === 'pve' && !gameOver && currentTurn === aiColor && !isAIPlaying){
                    scheduleAIMoveIfNeeded();
                }
            });
        }
        
        function init(){
            bindEvents();
            setMode('pvp');
            renderFullCanvas();
            window.addEventListener('resize', ()=> renderFullCanvas());
        }
        init();
    })();
</script>
</body>
</html>
